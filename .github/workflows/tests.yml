name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} / py${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ['3.9', '3.12', '3.13']
        exclude:
          # ubuntu-latest (26.04) no publica 3.9; se prueba en 22.04
          - os: ubuntu-latest
            python: '3.9'
        include:
          - os: ubuntu-22.04
            python: '3.9'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyyaml

      - name: Unit tests
        run: python -m unittest discover -s tests -v

      - name: Selftest
        run: python ghascan.py selftest

      - name: Demo scan
        run: python ghascan.py demo --format json --out demo-out

      - name: CLI help
        run: python ghascan.py --help
