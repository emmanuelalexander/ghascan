[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ghascan"
version = "1.0.0"
description = "GitHub Actions expression-injection dorker + SAST (43 dorks, FP rules, JSON/HTML/PDF)"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "ghascan contributors" }]
keywords = ["github-actions", "ci-cd", "security", "sast", "dorking"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Topic :: Security",
  "Operating System :: OS Independent",
]
dependencies = ["pyyaml>=6.0"]

[project.scripts]
ghascan = "ghascan:main"

[project.urls]
Homepage = "https://github.com/emmanuelalexander/ghascan"
Repository = "https://github.com/emmanuelalexander/ghascan"
Changelog = "https://github.com/emmanuelalexander/ghascan/blob/main/CHANGELOG.md"
Issues = "https://github.com/emmanuelalexander/ghascan/issues"

[tool.setuptools]
py-modules = ["ghascan"]
packages = ["ghascan_lib"]
